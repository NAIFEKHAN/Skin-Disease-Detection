# ==============================================================================
# Nginx Configuration: Skin Disease Detection & Cost Estimation (CP-1)
# Subdomain: skin-detection.duckdns.org
# Reverse Proxy to Internal Uvicorn Server: 127.0.0.1:8015
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name skin-detection.duckdns.org;

    # Allow Let's Encrypt ACME verification challenges WITHOUT authentication
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        auth_basic off;
        allow all;
    }

    # Maximum image upload size: 20MB
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Access Authentication: Protect entire clinical analysis application, reports, uploads & APIs
    auth_basic "Skin Disease Detection - Authorized Evaluator Access";
    auth_basic_user_file /etc/nginx/.htpasswd_skindisease;

    # Direct serving of frontend static assets
    location /static/ {
        alias /home/ubuntu/skindisease/frontend/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Reverse proxy to FastAPI / Uvicorn internal daemon on port 8015
    location / {
        proxy_pass http://127.0.0.1:8015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
    }
}
